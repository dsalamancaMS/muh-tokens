services:
  muh-tokens:
    build: .
    image: muh-tokens
    restart: unless-stopped
    environment:
      # Server-rendered times must match the browser's timezone, or React reports a hydration mismatch.
      TZ: ${TZ:-Australia/Hobart}
    ports:
      - "127.0.0.1:4817:4817"
    volumes:
      # Read-only, so the container never writes to the live Copilot database or its WAL files.
      - ${COPILOT_DIR:-~/.copilot}:/copilot:ro
      - muh-tokens-data:/data

volumes:
  muh-tokens-data:
